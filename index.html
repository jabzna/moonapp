<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Your Moon Phase</title>

        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <main class="moon-app">
            <h1>Your Moon Phase</h1>

            <p>Discover what phase the Moon was in on your birthday.</p>

            <section class="date-picker">
                <label for="birthdate"> Enter your birthdate </label>

                <input type="date" id="birthdate" max=""/> 
<br/>
                <button id="reveal-button">Reveal My Moon</button>
            </section>

            <section id="result" class="result" hidden>
                <div id="moon-visual"></div>

                <h2 id="phase-name"></h2>

                <p id="phase-description"></p>

                <div class="details">
                    <div>
                        <span>Illumination</span>
                        <strong id="illumination"></strong>
                    </div>

                    <div>
                        <span>Moon Age</span>
                        <strong id="moon-age"></strong>
                    </div>
                    <div>
                        <span>Zodiac Sign</span>
                        <strong id="zodiac-sign"></strong>
                    </div>
                </div>
            </section>

            <p id="error-message" class="error"></p>
        </main>

        <script src="script.js"></script>
    </body>
</html>
